<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EcoVision</title>
    
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="/static/css/login.css">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>

    <div class="auth-container animate-slide-up">
        <div class="card card-glass auth-card">
            <div class="auth-bg-blob"></div>

            <div class="auth-header">
                <div style="display: flex; justify-content: center; margin-bottom: var(--spacing-3);">
                    <div style="width: 40px; height: 40px; background: linear-gradient(135deg, var(--risk-low) 0%, var(--accent) 100%); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: white;">
                        <i data-feather="globe"></i>
                    </div>
                </div>
                <h1>Welcome back</h1>
                <p>Log in to access your dashboard</p>
            </div>

            <div class="error-msg" id="error-msg"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
                </div>
                
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between;">
                        <label for="password">Password</label>
                        <a href="#" style="font-size: 0.85rem; color: var(--accent);">Forgot password?</a>
                    </div>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary auth-btn">Log In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/templates/signup.html">Sign up</a>
            </div>
            <div class="auth-footer" style="margin-top: 10px;">
                <a href="/templates/index.html" style="color: var(--text-muted);"><i data-feather="arrow-left" style="width: 14px; height: 14px;"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        feather.replace();

        // Check if user is already logged in
        if (Auth.getSession()) {
            window.location.href = '/templates/dashboard.html';
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault(); // Stop page from refreshing
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('error-msg');

            const success = Auth.login(email, password);

            if (success) {
                // Redirect on success
                window.location.href = '/templates/dashboard.html';
            } else {
                // Show error
                errorBox.textContent = "Invalid email or password.";
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
