<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - EcoVision</title>
    
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="/static/css/signup.css">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>

    <div class="auth-container animate-slide-up">
        <div class="card card-glass auth-card">
            <div class="auth-bg-blob"></div>

            <div class="auth-header">
                <h1>Create an account</h1>
                <p>Join EcoVision intelligence network</p>
            </div>

            <div class="error-msg" id="error-msg"></div>
            <div class="success-msg" id="success-msg"></div>

            <form id="signup-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="fname">First Name</label>
                        <input type="text" id="fname" class="form-control" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label for="lname">Last Name</label>
                        <input type="text" id="lname" class="form-control" placeholder="Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary auth-btn">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/templates/login.html">Log in</a>
            </div>
            <div class="auth-footer" style="margin-top: 10px;">
                <a href="/templates/index.html" style="color: var(--text-muted);"><i data-feather="arrow-left" style="width: 14px; height: 14px;"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        feather.replace();

        // Check if user is already logged in
        if (Auth.getSession()) {
            window.location.href = '/templates/dashboard.html';
        }

        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault(); // Stop page from refreshing
            
            const fname = document.getElementById('fname').value;
            const lname = document.getElementById('lname').value;
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            const errorBox = document.getElementById('error-msg');
            const successBox = document.getElementById('success-msg');
            
            // Reset messages
            errorBox.style.display = 'none';
            successBox.style.display = 'none';

            // Validation logic
            if (password !== confirmPassword) {
                errorBox.textContent = "Passwords do not match.";
                errorBox.style.display = 'block';
                return;
            }

            // Attempt to create user via our Auth module
            const result = Auth.signup({
                firstName: fname,
                lastName: lname,
                email: email,
                password: password // In a real backend, passwords are NEVER stored in plain text!
            });

            if (result.success) {
                successBox.textContent = result.message + " Redirecting to login...";
                successBox.style.display = 'block';
                
                // Clear form
                document.getElementById('signup-form').reset();

                // Redirect to login after 1.5 seconds
                setTimeout(() => {
                    window.location.href = '/templates/login.html';
                }, 1500);

            } else {
                // Show error if email already exists
                errorBox.textContent = result.message;
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
